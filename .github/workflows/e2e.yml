name: e2e

# Scoped to admin/ and migration-bearing changes (not every PR): this job is
# meaningfully slower than the unit/pgTAP suites (starts the full local Supabase stack in
# Docker, builds admin/, launches a real browser), and e2e tests are inherently more prone
# to flakiness than unit tests. See admin/e2e/ for the suite itself.
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/config.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install Supabase CLI (root devDependency)
        run: npm ci

      - name: Start local Supabase stack (applies migrations + seed)
        run: npx supabase start

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Configure admin to use the local Supabase instance
        working-directory: admin
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" >> .env.local

      - name: Build admin (production bundle — same artifact Cloudflare Pages deploys)
        working-directory: admin
        run: npm run build

      - name: Run e2e tests
        working-directory: admin
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
