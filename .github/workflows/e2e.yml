name: e2e

# Always triggers (no path filter on `on:`) — see the comment in admin.yml for why: a
# required check that's absent from a PR (due to path filtering on `on:`) blocks merges
# forever, but one skipped via `if:` reports as passing. The paths-filter step decides, at
# run time, whether the real steps run or are skipped.
#
# Runs for changes anywhere under admin/ or supabase/ (not just migrations — e2e exercises
# the whole stack together, so e.g. an RLS policy tweak or a seed.sql change matters too).
# This job is meaningfully slower than the unit/pgTAP suites (starts the full local
# Supabase stack in Docker, builds admin/, launches a real browser) and e2e tests are more
# prone to flakiness than unit tests — see admin/e2e/ for the suite itself.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'admin/**'
              - 'supabase/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install Supabase CLI (root devDependency)
        if: steps.filter.outputs.relevant == 'true'
        run: npm ci

      - name: Start local Supabase stack (applies migrations + seed)
        if: steps.filter.outputs.relevant == 'true'
        run: npx supabase start

      - name: Install admin dependencies
        if: steps.filter.outputs.relevant == 'true'
        working-directory: admin
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.filter.outputs.relevant == 'true'
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Configure admin to use the local Supabase instance
        if: steps.filter.outputs.relevant == 'true'
        working-directory: admin
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" >> .env.local

      - name: Build admin (production bundle — same artifact Cloudflare Pages deploys)
        if: steps.filter.outputs.relevant == 'true'
        working-directory: admin
        run: npm run build

      - name: Run e2e tests
        if: steps.filter.outputs.relevant == 'true'
        working-directory: admin
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always() && steps.filter.outputs.relevant == 'true'
        run: npx supabase stop
