name: supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'admin/src/types/database.types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'admin/src/types/database.types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Supabase CLI (root devDependency)
        run: npm ci

      - name: Start local Supabase stack (applies migrations + seed)
        run: npx supabase start

      - name: Run pgTAP tests
        run: npx supabase test db

      - name: Check generated types are up to date with migrations
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          diff /tmp/database.types.ts admin/src/types/database.types.ts || {
            echo "::error::admin/src/types/database.types.ts is out of date. Run: npx supabase gen types typescript --local > admin/src/types/database.types.ts (and copy it to supabase/functions/_shared/)";
            exit 1;
          }
          diff /tmp/database.types.ts supabase/functions/_shared/database.types.ts || {
            echo "::error::supabase/functions/_shared/database.types.ts is out of date or out of sync with admin/src/types/database.types.ts";
            exit 1;
          }

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
